[package]
name = "skirmish-sim"
version = "0.1.0"
edition = "2021"
description = "Skirmish — headless deterministic simulation core (M2)"
# License: to be decided by the project owner. No LICENSE file is shipped
# until that decision is made.

[lib]
# cdylib so the wasm32 target emits a real .wasm for the JS shell (M4);
# rlib keeps native tests/lints working as usual.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: the sim must build bit-identically everywhere.
fixed = "=1.31.0"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# (none — determinism tests exercise the public API only)

# wasm-pack: skip the wasm-opt binaryen download (unavailable in this
# environment). The preview runs fine on unoptimized WASM.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
