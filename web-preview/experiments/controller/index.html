<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Experimento de Controle — Skirmish II</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #1c1710;
    font-family: Georgia, 'Times New Roman', serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #world { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---------- header: instruction + status ---------- */
  #hud-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 12px 0; pointer-events: none; text-align: center;
  }
  #hint {
    color: #f0e5c8; font-size: 13px; letter-spacing: .02em;
    background: rgba(20, 14, 6, .72); border: 1px solid rgba(201, 162, 39, .55);
    border-radius: 999px; padding: 6px 14px;
  }
  #status {
    color: #1c1710; font-weight: bold; font-size: 14px;
    background: #e8d9a8; border: 1px solid #c9a227; border-radius: 8px;
    padding: 6px 14px; min-height: 32px; max-width: 92vw;
  }

  /* ---------- center dot: the pointer ---------- */
  #dot-ring {
    position: fixed; left: 50%; top: 50%; z-index: 4;
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border: 2px solid rgba(240, 229, 200, .9); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.25);
    pointer-events: none;
  }
  #dot {
    position: fixed; left: 50%; top: 50%; z-index: 4;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    background: #ffd75e; border: 1px solid rgba(0,0,0,.5); border-radius: 50%;
    pointer-events: none;
  }
  #dot-ring.hot { border-color: #ffd75e; box-shadow: 0 0 12px rgba(255, 215, 94, .8); }
  #dot-ring.wheel { border-color: #ffd75e; transform: scale(1.1); box-shadow: 0 0 18px rgba(255, 215, 94, .9); }

  /* ---------- floating joystick (left thumb) ---------- */
  #stick-base, #stick-knob { position: fixed; z-index: 6; border-radius: 50%; pointer-events: none; display: none; }
  #stick-base {
    width: 116px; height: 116px;
    background: rgba(240, 229, 200, .10); border: 2px solid rgba(240, 229, 200, .45);
  }
  #stick-knob {
    width: 52px; height: 52px;
    background: rgba(240, 229, 200, .35); border: 2px solid rgba(240, 229, 200, .7);
  }

  /* ---------- roda rotativa flutuante (polegar direito) ----------
     A MESMA roda transparente do joystick, mas do lado direito:
     aparece onde o polegar pousa e não move nada — é um botão
     rotativo. Dar a volta com o dedo roda o menu radial do centro
     do ecrã; soltar seleciona. O marcador dourado dentro da roda
     gira com a rotação acumulada, a espelhar o menu. */
  #dial-base, #dial-knob { position: fixed; z-index: 6; border-radius: 50%; pointer-events: none; display: none; }
  #dial-base {
    width: 116px; height: 116px;
    background: rgba(240, 229, 200, .10); border: 2px solid rgba(240, 229, 200, .45);
  }
  #dial-base.on { border-color: #ffd75e; box-shadow: 0 0 16px rgba(255, 215, 94, .55); }
  #dial-knob {
    width: 52px; height: 52px;
    background: rgba(240, 229, 200, .35); border: 2px solid rgba(240, 229, 200, .7);
  }
  #dial-rotor { position: absolute; inset: 0; pointer-events: none; }
  #dial-marker {
    position: absolute; left: 50%; top: 4px; width: 13px; height: 13px;
    margin-left: -6.5px; border-radius: 50%; background: #ffd75e;
    border: 2px solid rgba(0,0,0,.5); box-shadow: 0 0 8px rgba(255,215,94,.85);
  }

  #foot {
    position: fixed; left: 0; right: 0; bottom: 8px; z-index: 5;
    text-align: center; color: rgba(240, 229, 200, .75); font-size: 12px;
    pointer-events: none; text-shadow: 0 1px 2px #000;
  }

  /* ---------- orientação: consola (paisagem) vs retrato ----------
     A classe .landscape/.portrait no <body> é posta por JS via
     matchMedia('(orientation: landscape)') — muda ao virar o
     telefone, sem recarregar. Os controlos são flutuantes (seguem
     os polegares), por isso a orientação só ajusta o cabeçalho e
     mostra o aviso para virar em retrato. */
  #rotate-hint {
    display: none;
    color: rgba(240, 229, 200, .85); font-size: 11px; letter-spacing: .02em;
    background: rgba(20, 14, 6, .45); border: 1px solid rgba(201, 162, 39, .3);
    border-radius: 999px; padding: 4px 10px;
  }
  body.portrait #rotate-hint { display: block; }
  body.landscape #hud-top { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  body.landscape #status, body.landscape #hint { max-width: 58vw; }
</style>

<body>

<canvas id="world"></canvas>

<div id="hud-top">
  <div id="hint">Esquerda move a câmara · Direita: gira à volta da roda para rodar o menu do centro — solta para selecionar</div>
  <div id="status">A carregar…</div>
  <div id="rotate-hint">Vira o telefone para jogar como consola</div>
</div>

<div id="dot-ring"></div>
<div id="dot"></div>

<div id="stick-base"></div>
<div id="stick-knob"></div>

<div id="dial-base"><div id="dial-rotor"><div id="dial-marker"></div></div></div>
<div id="dial-knob"></div>

<div id="foot">Experimento de controle — não faz parte do jogo (ainda).</div>

<script>
'use strict';
/* =====================================================================
   EXPERIMENTO DE CONTROLE — página isolada, não faz parte do jogo.
   Esquema de consola para RTS no telemóvel (v5):
   - DUAS rodas transparentes flutuantes, uma para cada polegar:
     à ESQUERDA o joystick de sempre — aparece onde o polegar pousa
     e arrastar move a câmara; à DIREITA a mesma roda visual, mas é
     um BOTÃO ROTATIVO — dar a volta com o dedo roda o menu radial
     à volta do ponto central; soltar seleciona;
   - ponto fixo no centro do ecrã é a mira/ponteiro: um toque nele
     faz a ação inteligente (selecionar / ordenar);
   Sem botões Xbox, sem rodas fixas nos cantos.
   ===================================================================== */

var WORLD_W = 2400, WORLD_H = 1600;
var cv = document.getElementById('world');
var ctx = cv.getContext('2d');
var viewW = 0, viewH = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth; viewH = window.innerHeight;
  cv.width = Math.round(viewW * dpr); cv.height = Math.round(viewH * dpr);
  cv.style.width = viewW + 'px'; cv.style.height = viewH + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------------- mundo ---------------- */
var patches = [];
(function makeTerrain() {
  var cols = ['#5d7a35', '#64853a', '#556f31', '#6b8a40'];
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var gy = 0; gy < 8; gy++) for (var gx = 0; gx < 12; gx++) {
    patches.push({ x: gx * 200, y: gy * 200, w: 200, h: 200, c: cols[Math.floor(rnd() * cols.length)] });
  }
  patches.push({ x: 240, y: 1020, w: 560, h: 480, c: '#8a734a' });   // terra junto à base
  patches.push({ x: 1650, y: 150, w: 620, h: 420, c: '#a08b57' });   // clareira arenosa
  patches.push({ x: 1000, y: 900, w: 480, h: 380, c: '#4e6b2d' });   // relva densa
})();

var base = { x: 430, y: 1240, size: 128, kind: 'base' };

var nodes = [];
(function makeNodes() {
  var trees = [[700, 350], [860, 300], [1010, 380], [790, 520], [1500, 1050], [1620, 980], [2050, 1250], [2180, 1120]];
  var berries = [[1120, 700], [1260, 760], [1900, 480]];
  trees.forEach(function (p) { nodes.push({ x: p[0], y: p[1], r: 22, kind: 'tree', amount: 100 }); });
  berries.forEach(function (p) { nodes.push({ x: p[0], y: p[1], r: 20, kind: 'berry', amount: 100 }); });
})();

var units = [];
function addUnit(x, y, side) {
  units.push({ x: x, y: y, r: 12, side: side, hp: 100, order: null, flash: 0 });
}
addUnit(600, 1180, 'me'); addUnit(620, 1300, 'me'); addUnit(540, 1360, 'me');
addUnit(1250, 900, 'neutral'); addUnit(1330, 960, 'neutral');
addUnit(2000, 700, 'enemy'); addUnit(2080, 780, 'enemy');

var selected = null;      // a minha unidade selecionada
var constructions = [];   // casas/fazendas do menu radial (demo)
var cam = { x: base.x - viewW / 2, y: base.y - viewH / 2 };

/* -------- menu radial: a roda da direita gira, soltar seleciona -------- */
var WHEEL_ITEMS = [
  { id: 'move',   label: 'Mover' },
  { id: 'gather', label: 'Recolher' },
  { id: 'attack', label: 'Atacar' },
  { id: 'house',  label: 'Casa' },
  { id: 'farm',   label: 'Fazenda' },
  { id: 'stop',   label: 'Parar' }
];
var WHEEL_IN = 52;
var DOT_TAP_ZONE = 70, DOT_TAP_MS = 350, DOT_TAP_SLOP = 14;
var dial = null;  // { id, ax, ay, lastAng, rot, slice, hadSlice, target } — roda rotativa da direita
var statusOverride = '', statusOverrideUntil = 0;
function note(text, ms) {
  statusOverride = text;
  statusOverrideUntil = performance.now() + (ms || 1800);
}
function wheelOuter() { return Math.min(158, Math.min(viewW, viewH) * 0.42); }

function clampCam() {
  cam.x = Math.max(0, Math.min(WORLD_W - viewW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H - viewH, cam.y));
}
clampCam();

/* ---------------- mira (ponto central) ---------------- */
function dotWorld() { return { x: cam.x + viewW / 2, y: cam.y + viewH / 2 }; }

function targetAtDot() {
  var p = dotWorld();
  var best = null, bestD = 1e9;
  units.forEach(function (u) {
    var d = Math.hypot(u.x - p.x, u.y - p.y);
    if (d < u.r + 22 && d < bestD) { best = u; bestD = d; }
  });
  if (best) return { what: 'unit', u: best };
  nodes.forEach(function (n) {
    if (n.amount <= 0) return;
    var d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < n.r + 22 && d < bestD) { best = n; bestD = d; }
  });
  if (best) return { what: 'node', n: best };
  if (Math.abs(p.x - base.x) < base.size / 2 + 14 && Math.abs(p.y - base.y) < base.size / 2 + 14) {
    return { what: 'base' };
  }
  return { what: 'ground', x: p.x, y: p.y };
}

var statusEl = document.getElementById('status');
var ringEl = document.getElementById('dot-ring');

function statusText(t) {
  if (t.what === 'unit') {
    if (t.u.side === 'me') return 'Aldeão (teu) — toca no ponto para selecionar';
    if (t.u.side === 'enemy') return selected ? 'Inimigo — toca no ponto para atacar · ou gira a roda da direita' : 'Inimigo — seleciona um aldeão primeiro';
    return selected ? 'Unidade neutra — toca no ponto para atacar · ou gira a roda da direita' : 'Unidade neutra — seleciona um aldeão primeiro';
  }
  if (t.what === 'node') {
    var name = t.n.kind === 'tree' ? 'Árvore' : 'Bagas';
    return selected ? name + ' — toca no ponto para recolher · ou gira a roda da direita' : name + ' — seleciona um aldeão primeiro';
  }
  if (t.what === 'base') return selected ? 'Centro da Vila — toca no ponto para mover para aqui' : 'Centro da Vila — a tua base';
  return selected ? 'Chão — toca no ponto para mover o selecionado · ou gira a roda da direita' : 'Chão — toca no ponto sobre um aldeão teu para o selecionar';
}

/* ---------------- ordens ---------------- */
function orderMove(u, x, y) { u.order = { type: 'move', x: x, y: y }; }
function orderToEntity(u, ent, type) { u.order = { type: type, ent: ent }; }

/* ---------------- menu radial ---------------- */
/* A roda da direita é um BOTÃO ROTATIVO: o que conta é a ROTAÇÃO
   ACUMULADA do dedo à volta do centro da roda (dar a volta), não a
   posição absoluta do dedo. A rotação roda o destaque no menu do
   centro 1:1, no mesmo sentido — mesma convenção das fatias do
   menu: 6 setores de 60°, a começar no Mover. */
var ROT_THRESHOLD = 20;   // graus de rotação até o destaque acender
function angDelta(a, b) {   // delta de ângulo a→b em graus, em (-180, 180]
  var d = (b - a) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}
function sliceFromRot(rot) {
  var deg = ((rot % 360) + 360) % 360;
  return Math.floor(deg / 60) % WHEEL_ITEMS.length;
}
var dialBaseEl = document.getElementById('dial-base');
var dialKnobEl = document.getElementById('dial-knob');
var dialRotorEl = document.getElementById('dial-rotor');
function dialShow(x, y) {
  dialBaseEl.style.display = dialKnobEl.style.display = 'block';
  dialBaseEl.style.left = (x - 58) + 'px'; dialBaseEl.style.top = (y - 58) + 'px';
  dialBaseEl.classList.remove('on');
  dialRotorEl.style.transform = 'rotate(0deg)';
  dialKnobEl.style.left = (x - 26) + 'px'; dialKnobEl.style.top = (y - 26) + 'px';
}
function dialHide() {
  dialBaseEl.style.display = dialKnobEl.style.display = 'none';
  dialBaseEl.classList.remove('on');
}
function cancelDial() {
  if (!dial) return;
  var had = dial.hadSlice;
  dial = null;
  dialHide();
  if (had) note('Menu cancelado');
}
function nearestNode(p, maxD) {
  var best = null, bestD = maxD;
  nodes.forEach(function (n) {
    if (n.amount <= 0) return;
    var d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < bestD) { best = n; bestD = d; }
  });
  return best;
}
function nearestFoe(p, maxD) {
  var best = null, bestD = maxD;
  units.forEach(function (u) {
    if (u.side === 'me' || u.hp <= 0) return;
    var d = Math.hypot(u.x - p.x, u.y - p.y);
    if (d < bestD) { best = u; bestD = d; }
  });
  return best;
}
function executeWheel(idx, target) {
  var u = selected, item = WHEEL_ITEMS[idx];
  if (!u || !item || !target) return;
  if (item.id === 'move') {
    orderMove(u, target.x, target.y);
    note('Ordem: Mover para o ponto');
  } else if (item.id === 'gather') {
    var n = nearestNode(target, 280);
    if (n) { orderToEntity(u, n, 'gather'); note('Ordem: Recolher ' + (n.kind === 'tree' ? 'a árvore' : 'as bagas')); }
    else note('Sem recurso perto do ponto');
  } else if (item.id === 'attack') {
    var f = nearestFoe(target, 280);
    if (f) { orderToEntity(u, f, 'attack'); note('Ordem: Atacar o alvo'); }
    else note('Sem inimigo perto do ponto');
  } else if (item.id === 'house' || item.id === 'farm') {
    var b = {
      x: target.x, y: target.y, kind: item.id,
      size: item.id === 'house' ? 54 : 68,
      progress: 0, built: false
    };
    constructions.push(b);
    u.order = { type: 'build', building: b };
    note('Ordem: construir ' + (item.id === 'house' ? 'Casa' : 'Fazenda'));
  } else if (item.id === 'stop') {
    u.order = null;
    note('Ordem: Parar');
  }
}
function dialEnd(e, cancelled) {
  if (!dial || e.pointerId !== dial.id) return;
  var d = dial;
  dial = null;
  dialHide();
  if (cancelled) { if (d.hadSlice) note('Menu cancelado'); return; }
  if (!selected) return;   // sem seleção o menu aparece desativado — nada executa
  if (d.slice >= 0) executeWheel(d.slice, d.target);
  else if (d.hadSlice) note('Menu cancelado');
}
/* A roda rotativa nasce onde o polegar direito pousa (metade
   direita do ecrã) — flutuante, como o joystick. Não move nada:
   acumula a rotação do dedo à volta do seu centro e roda o
   destaque do menu do centro; soltar seleciona. Soltar com pouca
   rotação (sem destaque) cancela. */
function startDial(e) {
  if (dial) return;
  dial = {
    id: e.pointerId, ax: e.clientX, ay: e.clientY,
    lastAng: null, rot: 0,
    slice: -1, hadSlice: false,
    target: dotWorld()           // o ponto do mundo fica capturado ao tocar
  };
  dialShow(e.clientX, e.clientY);
}
function dialMove(e) {
  var d = dial;
  if (!d || e.pointerId !== d.id) return;
  var dx = e.clientX - d.ax, dy = e.clientY - d.ay;
  var dist = Math.hypot(dx, dy);
  // o botão da roda segue o dedo, preso ao raio — como o joystick
  var kx = dx, ky = dy;
  if (dist > STICK_R) { kx = dx / dist * STICK_R; ky = dy / dist * STICK_R; }
  dialKnobEl.style.left = (d.ax + kx - 26) + 'px';
  dialKnobEl.style.top = (d.ay + ky - 26) + 'px';
  // rotação acumulada: só conta quando o dedo está fora do centro
  if (dist > 14) {
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    if (d.lastAng !== null) d.rot += angDelta(d.lastAng, ang);
    d.lastAng = ang;
  }
  if (Math.abs(d.rot) > ROT_THRESHOLD) {
    d.slice = sliceFromRot(d.rot);
    d.hadSlice = true;
  } else {
    d.slice = -1;
  }
  dialRotorEl.style.transform = 'rotate(' + d.rot + 'deg)';
  dialBaseEl.classList.toggle('on', d.slice >= 0);
}

/* Toque no ponto central = ação inteligente (a antiga ação "A"):
   sem seleção, seleciona a minha unidade sob a mira; com seleção,
   dá a ordem óbvia no ponto (recolher / atacar / mover). */
function tapDot() {
  var t = targetAtDot();
  if (t.what === 'unit' && t.u.side === 'me') { selected = t.u; return; }
  if (!selected) { note('Primeiro seleciona um aldeão teu'); return; }
  if (t.what === 'ground') orderMove(selected, t.x, t.y);
  else if (t.what === 'base') orderMove(selected, base.x, base.y + base.size / 2 + 30);
  else if (t.what === 'node') orderToEntity(selected, t.n, 'gather');
  else if (t.what === 'unit') orderToEntity(selected, t.u, 'attack');
}
var tapCand = null;   // { id, x, y, t } — toque no ponto à espera de soltar

/* ---------------- joystick flutuante (metade esquerda) ---------------- */
var stick = { id: null, ax: 0, ay: 0, dx: 0, dy: 0 };
var baseEl = document.getElementById('stick-base');
var knobEl = document.getElementById('stick-knob');
var STICK_R = 46;

function stickShow(x, y) {
  baseEl.style.display = knobEl.style.display = 'block';
  baseEl.style.left = (x - 58) + 'px'; baseEl.style.top = (y - 58) + 'px';
  stickKnob(x, y);
}
function stickKnob(x, y) {
  knobEl.style.left = (x - 26) + 'px'; knobEl.style.top = (y - 26) + 'px';
}
function stickHide() { baseEl.style.display = knobEl.style.display = 'none'; }

cv.addEventListener('pointerdown', function (e) {
  // Zona do ponto central (~70 px): um TOQUE faz a ação inteligente
  // (com a roda da direita ativa, o ponto está ocupado pelo menu).
  var dc = Math.hypot(e.clientX - window.innerWidth / 2, e.clientY - window.innerHeight / 2);
  if (dc <= DOT_TAP_ZONE) {
    if (!dial) tapCand = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
    return;
  }
  if (e.clientX >= window.innerWidth / 2) { startDial(e); return; }   // metade direita: nasce a roda rotativa
  if (stick.id !== null) return;
  stick.id = e.pointerId; stick.ax = e.clientX; stick.ay = e.clientY; stick.dx = 0; stick.dy = 0;
  stick.px = e.clientX; stick.py = e.clientY;
  stickShow(e.clientX, e.clientY);
});
window.addEventListener('pointermove', function (e) {
  if (dial && e.pointerId === dial.id) { dialMove(e); return; }
  if (tapCand && e.pointerId === tapCand.id) {
    if (Math.hypot(e.clientX - tapCand.x, e.clientY - tapCand.y) > DOT_TAP_SLOP) tapCand = null;
    return;
  }
  if (e.pointerId !== stick.id) return;
  stick.px = e.clientX; stick.py = e.clientY;
  var dx = e.clientX - stick.ax, dy = e.clientY - stick.ay;
  var d = Math.hypot(dx, dy);
  if (d > STICK_R) { dx = dx / d * STICK_R; dy = dy / d * STICK_R; }
  stick.dx = dx / STICK_R; stick.dy = dy / STICK_R;
  stickKnob(stick.ax + dx, stick.ay + dy);
});
function stickEnd(e) {
  if (e.pointerId !== stick.id) return;
  stick.id = null; stick.dx = 0; stick.dy = 0; stickHide();
}
window.addEventListener('pointerup', stickEnd);
window.addEventListener('pointercancel', stickEnd);
window.addEventListener('pointerup', function (e) {
  if (tapCand && e.pointerId === tapCand.id) {
    var c = tapCand; tapCand = null;
    if (!dial && performance.now() - c.t < DOT_TAP_MS &&
        Math.hypot(e.clientX - c.x, e.clientY - c.y) <= DOT_TAP_SLOP) tapDot();
  }
  dialEnd(e, false);
});
window.addEventListener('pointercancel', function (e) {
  if (tapCand && e.pointerId === tapCand.id) tapCand = null;
  dialEnd(e, true);
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------------- orientação: detetar e adaptar ----------------
   matchMedia é o sinal fiável no Safari iOS; screen.orientation é
   só recurso. A classe no <body> muda o layout (CSS) ao vivo, sem
   recarregar: os controlos são flutuantes e seguem os polegares
   em qualquer orientação; em retrato aparece o aviso para virar.
   Rodar a meio de um gesto da roda cancela o menu limpo. */
function isLandscape() {
  if (window.matchMedia) return window.matchMedia('(orientation: landscape)').matches;
  if (window.screen && screen.orientation && screen.orientation.type) {
    return screen.orientation.type.indexOf('landscape') === 0;
  }
  return window.innerWidth >= window.innerHeight;
}

function stickReanchor() {
  if (stick.id === null) return;
  // Mantém o deslocamento atual: a âncora passa a ficar atrás do
  // último ponto conhecido do dedo, já nas coordenadas novas, e
  // presa à metade esquerda do ecrã rodado — a câmara continua a
  // andar e o stick não fica "colado" nem fora do ecrã.
  var px = (stick.px !== undefined) ? stick.px : stick.ax + stick.dx * STICK_R;
  var py = (stick.py !== undefined) ? stick.py : stick.ay + stick.dy * STICK_R;
  stick.ax = px - stick.dx * STICK_R;
  stick.ay = py - stick.dy * STICK_R;
  stick.ax = Math.max(30, Math.min(window.innerWidth / 2 - 10, stick.ax));
  stick.ay = Math.max(30, Math.min(window.innerHeight - 30, stick.ay));
  baseEl.style.display = knobEl.style.display = 'block';
  baseEl.style.left = (stick.ax - 58) + 'px'; baseEl.style.top = (stick.ay - 58) + 'px';
  stickKnob(stick.ax + stick.dx * STICK_R, stick.ay + stick.dy * STICK_R);
}

function applyOrientation() {
  cancelDial();   // rodar a meio do gesto cancela limpo
  var land = isLandscape();
  document.body.classList.toggle('landscape', land);
  document.body.classList.toggle('portrait', !land);
  resize();
  clampCam();
  stickReanchor();
}
var orientMql = window.matchMedia ? window.matchMedia('(orientation: landscape)') : null;
if (orientMql) {
  if (orientMql.addEventListener) orientMql.addEventListener('change', applyOrientation);
  else if (orientMql.addListener) orientMql.addListener(applyOrientation);
}
window.addEventListener('orientationchange', applyOrientation);
window.addEventListener('resize', applyOrientation);
applyOrientation();

/* ---------------- simulação simples ---------------- */
var SPEED = 150;
function stepUnits(dt) {
  units.forEach(function (u) {
    if (u.flash > 0) u.flash -= dt;
    if (!u.order) return;
    var o = u.order, tx, ty, stopD;
    if (o.type === 'move') { tx = o.x; ty = o.y; stopD = 4; }
    else if (o.type === 'build') {
      var b = o.building;
      if (b.built) { u.order = null; return; }
      tx = b.x; ty = b.y; stopD = b.size * 0.72 + u.r + 4;
      var bd = Math.hypot(tx - u.x, ty - u.y);
      if (bd > stopD) {
        u.x += (tx - u.x) / bd * SPEED * dt; u.y += (ty - u.y) / bd * SPEED * dt;
      } else {
        b.progress += dt / 1.8;                 // ~1,8 s a construir (demo)
        if (b.progress >= 1) { b.progress = 1; b.built = true; u.order = null; }
      }
      return;   // ordem de construção tratada aqui — não cai no movimento genérico
    }
    else {
      if (o.ent.hp !== undefined && o.ent.hp <= 0) { u.order = null; return; }
      if (o.ent.amount !== undefined && o.ent.amount <= 0) { u.order = null; return; }
      tx = o.ent.x; ty = o.ent.y; stopD = (o.ent.r || 20) + u.r + 8;
    }
    var dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
    if (d > stopD) {
      u.x += dx / d * SPEED * dt; u.y += dy / d * SPEED * dt;
    } else if (o.type === 'move') {
      u.order = null;
    } else if (o.type === 'gather') {
      o.ent.amount = Math.max(0, o.ent.amount - 22 * dt);
      if (o.ent.amount <= 0) u.order = null;
    } else if (o.type === 'attack') {
      o.ent.hp -= 40 * dt; o.ent.flash = 0.12;
      if (o.ent.hp <= 0) u.order = null;
    }
  });
  units = units.filter(function (u) { return u.hp > 0; });
  if (selected && selected.hp <= 0) selected = null;
}

/* ---------------- desenho ---------------- */
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, viewW, viewH);
  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  patches.forEach(function (p) { ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.w, p.h); });

  // base: quadrado tipo Centro da Vila
  ctx.fillStyle = '#7d7468'; ctx.fillRect(base.x - base.size / 2, base.y - base.size / 2, base.size, base.size);
  ctx.fillStyle = '#9c2b16'; ctx.fillRect(base.x - base.size / 2 + 14, base.y - base.size / 2 + 14, base.size - 28, base.size - 28);
  ctx.fillStyle = '#c9a227'; ctx.fillRect(base.x - 5, base.y - base.size / 2 - 16, 10, 18);
  ctx.fillStyle = '#f0e5c8'; ctx.font = 'bold 15px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('Centro da Vila', base.x, base.y + base.size / 2 + 22);

  var t = targetAtDot();

  // recursos
  nodes.forEach(function (n) {
    if (n.kind === 'tree') {
      if (n.amount > 0) {
        ctx.fillStyle = '#5d4630'; ctx.fillRect(n.x - 4, n.y + 4, 8, 16);
        ctx.fillStyle = '#2e5d27'; ctx.beginPath(); ctx.arc(n.x, n.y - 6, 20, 0, 7); ctx.fill();
        ctx.fillStyle = '#3a7031'; ctx.beginPath(); ctx.arc(n.x - 7, n.y - 12, 12, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = '#6e5840'; ctx.fillRect(n.x - 6, n.y + 6, 12, 9);
      }
    } else {
      ctx.fillStyle = n.amount > 0 ? '#46682e' : '#7a7a52';
      ctx.beginPath(); ctx.arc(n.x, n.y, 18, 0, 7); ctx.fill();
      if (n.amount > 0) {
        ctx.fillStyle = '#b03a6e';
        [[-8, -4], [6, -8], [0, 6], [10, 4], [-11, 7]].forEach(function (o) {
          ctx.beginPath(); ctx.arc(n.x + o[0], n.y + o[1], 3.4, 0, 7); ctx.fill();
        });
      }
    }
    if (t.what === 'node' && t.n === n) {
      ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 9, 0, 7); ctx.stroke();
    }
  });

  // construções do menu radial (casa/fazenda): translúcidas a
  // construir, sólidas quando prontas
  constructions.forEach(function (b) {
    var h = b.size / 2;
    ctx.save();
    if (!b.built) ctx.globalAlpha = 0.45;
    if (b.kind === 'house') {
      ctx.fillStyle = '#8a6a44'; ctx.fillRect(b.x - h, b.y - h + 8, b.size, b.size - 8);
      ctx.fillStyle = '#9c2b16';
      ctx.beginPath(); ctx.moveTo(b.x - h - 4, b.y - h + 10); ctx.lineTo(b.x, b.y - h - 12); ctx.lineTo(b.x + h + 4, b.y - h + 10); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#7a5c33'; ctx.fillRect(b.x - h, b.y - h, b.size, b.size);
      ctx.strokeStyle = '#4e6b2d'; ctx.lineWidth = 4;
      for (var r = -1; r <= 1; r++) {
        ctx.beginPath(); ctx.moveTo(b.x - h + 5, b.y + r * 16);
        ctx.quadraticCurveTo(b.x, b.y + r * 16 - 6, b.x + h - 5, b.y + r * 16); ctx.stroke();
      }
    }
    ctx.restore();
    ctx.strokeStyle = b.built ? 'rgba(0,0,0,.5)' : '#ffd75e'; ctx.lineWidth = 2;
    ctx.strokeRect(b.x - h, b.y - h, b.size, b.size);
    if (!b.built) {
      ctx.fillStyle = '#000'; ctx.fillRect(b.x - h, b.y + h + 5, b.size, 6);
      ctx.fillStyle = '#ffd75e'; ctx.fillRect(b.x - h + 1, b.y + h + 6, (b.size - 2) * b.progress, 4);
    }
    ctx.fillStyle = '#f0e5c8'; ctx.font = 'bold 12px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(b.kind === 'house' ? 'Casa' : 'Fazenda', b.x, b.y + h + 24);
  });

  // alvo capturado ao tocar na roda da direita
  if (dial && selected && dial.target) {
    var wt = dial.target;
    ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(wt.x, wt.y, 16, 0, 7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(wt.x - 22, wt.y); ctx.lineTo(wt.x + 22, wt.y);
    ctx.moveTo(wt.x, wt.y - 22); ctx.lineTo(wt.x, wt.y + 22);
    ctx.stroke();
  }

  // unidades
  units.forEach(function (u) {
    if (u.order && u === selected) {
      var tp = null;
      if (u.order.type === 'move') tp = u.order;
      else if (u.order.type === 'build') tp = u.order.building;
      else if (u.order.ent) tp = u.order.ent;
      if (tp) {
        ctx.strokeStyle = 'rgba(240,229,200,.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
      }
    }
    ctx.fillStyle = u.side === 'me' ? '#2b6fd3' : (u.side === 'enemy' ? '#cf3527' : '#9a958c');
    if (u.flash > 0) ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 2; ctx.stroke();
    if (u === selected) {
      ctx.strokeStyle = '#7ee787'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 6, 0, 7); ctx.stroke();
    }
    if (t.what === 'unit' && t.u === u) {
      ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 10, 0, 7); ctx.stroke();
    }
    if (u.hp < 100) {
      ctx.fillStyle = '#000'; ctx.fillRect(u.x - 14, u.y - u.r - 12, 28, 5);
      ctx.fillStyle = '#7ee787'; ctx.fillRect(u.x - 13, u.y - u.r - 11, 26 * Math.max(0, u.hp) / 100, 3);
    }
  });

  ctx.restore();
  if (dial) drawWheel();
  return t;
}

/* -------- desenho do menu radial (espaço do ecrã) -------- */
function drawWheelIcon(kind, x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  if (kind === 'move') {
    ctx.beginPath(); ctx.moveTo(-s, 0); ctx.lineTo(s - 3, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s - 10, -6); ctx.lineTo(s, 0); ctx.lineTo(s - 10, 6); ctx.stroke();
  } else if (kind === 'gather') {
    [[-4, 2], [4, 2], [0, 8]].forEach(function (o) {
      ctx.beginPath(); ctx.arc(o[0], o[1], 4.4, 0, 7); ctx.fill();
    });
    ctx.beginPath(); ctx.moveTo(0, -2); ctx.quadraticCurveTo(2, -9, 8, -10); ctx.stroke();
  } else if (kind === 'attack') {
    ctx.beginPath(); ctx.moveTo(-s + 2, s - 2); ctx.lineTo(s - 2, -s + 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s + 2, -s + 2); ctx.lineTo(s - 2, s - 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, 7); ctx.fill();
  } else if (kind === 'house') {
    ctx.strokeRect(-s + 2, -1, (s - 2) * 2, s - 1);
    ctx.beginPath(); ctx.moveTo(-s - 1, 0); ctx.lineTo(0, -s); ctx.lineTo(s + 1, 0); ctx.stroke();
  } else if (kind === 'farm') {
    for (var r = -1; r <= 1; r++) {
      ctx.beginPath(); ctx.moveTo(-s, r * 6);
      ctx.quadraticCurveTo(-s / 2, r * 6 - 4, 0, r * 6);
      ctx.quadraticCurveTo(s / 2, r * 6 + 4, s, r * 6); ctx.stroke();
    }
  } else if (kind === 'stop') {
    ctx.beginPath();
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4 + Math.PI / 8;
      var px = Math.cos(a) * s, py = Math.sin(a) * s;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawWheel() {
  var cx = viewW / 2, cy = viewH / 2;
  var rOut = wheelOuter(), rIn = WHEEL_IN;
  var disabled = !selected;   // sem seleção: menu visível mas desativado
  ctx.beginPath(); ctx.arc(cx, cy, rOut + 12, 0, 7);
  ctx.fillStyle = 'rgba(20, 14, 6, .5)'; ctx.fill();
  for (var i = 0; i < WHEEL_ITEMS.length; i++) {
    var a0 = (i * 60 - 90) * Math.PI / 180, a1 = a0 + Math.PI / 3, am = (a0 + a1) / 2;
    var hot = !disabled && dial.slice === i;
    var ro = hot ? rOut + 12 : rOut;
    ctx.beginPath();
    ctx.arc(cx, cy, ro, a0, a1);
    ctx.arc(cx, cy, rIn, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = hot ? 'rgba(201, 162, 39, .95)'
      : disabled ? 'rgba(150, 150, 150, .5)' : 'rgba(232, 217, 168, .88)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(28, 20, 6, .8)'; ctx.lineWidth = 2; ctx.stroke();
    var color = hot ? '#241a02' : disabled ? 'rgba(30, 30, 30, .55)' : '#4a3a16';
    var ir = rIn + (ro - rIn) * 0.34, lr = rIn + (ro - rIn) * 0.72;
    drawWheelIcon(WHEEL_ITEMS[i].id, cx + Math.cos(am) * ir, cy + Math.sin(am) * ir, hot ? 12 : 10, color);
    ctx.fillStyle = color; ctx.textAlign = 'center';
    ctx.font = 'bold ' + (hot ? 17 : 13.5) + 'px Georgia';
    ctx.fillText(WHEEL_ITEMS[i].label, cx + Math.cos(am) * lr, cy + Math.sin(am) * lr + 5);
  }
  // centro: a mira — o alvo das ordens (cancelar é soltar sem destacar)
  ctx.beginPath(); ctx.arc(cx, cy, rIn - 6, 0, 7);
  ctx.fillStyle = 'rgba(20, 14, 6, .55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 7);
  ctx.fillStyle = disabled ? 'rgba(200, 200, 200, .6)' : '#ffd75e'; ctx.fill();
}

/* ---------------- ciclo principal ---------------- */
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (stick.id !== null && !dial) {   // roda ativa: câmara congela
    cam.x += stick.dx * 950 * dt;
    cam.y += stick.dy * 950 * dt;
    clampCam();
  }
  stepUnits(dt);
  var t = draw();
  var s;
  if (dial) {
    if (!selected) s = 'Menu radial — seleciona um aldeão primeiro (toca no ponto sobre ele)';
    else if (dial.slice >= 0) s = 'Menu: ' + WHEEL_ITEMS[dial.slice].label + ' — solta para confirmar';
    else s = 'Menu radial — continua a girar à volta da roda da direita e solta numa fatia';
  } else if (statusOverride && now < statusOverrideUntil) {
    s = statusOverride;
  } else {
    s = statusText(t);
  }
  if (statusEl.textContent !== s) statusEl.textContent = s;
  ringEl.classList.toggle('hot', t.what !== 'ground');
  ringEl.classList.toggle('wheel', !!dial);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
