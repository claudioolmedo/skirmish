<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skirmish — Debug Preview (M1)</title>
<style>
  body {
    font-family: ui-monospace, monospace;
    background: #111;
    color: #ddd;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .label {
    color: #ffcf4d;
    font-weight: bold;
    margin: 12px 8px 4px;
    text-align: center;
    font-size: 14px;
  }
  #hud {
    padding: 8px;
    font-size: 13px;
    color: #8fd18f;
  }
  canvas {
    border: 1px solid #444;
    cursor: crosshair;
    max-width: 96vw;
    max-height: 76vh;
  }
  .hint {
    font-size: 12px;
    color: #888;
    padding: 8px;
    text-align: center;
  }
  code { color: #bbb; }
</style>
</head>
<body>
<div class="label">SKIRMISH · DEBUG PREVIEW · M1 (programmer art, top-down debug view — not the final isometric camera)</div>
<div id="hud">loading…</div>
<canvas id="view" width="720" height="720"></canvas>
<div class="hint">Click anywhere to order all units to move there. Seed via <code>?seed=N</code>.</div>
<script type="module" src="app.js"></script>
</body>
</html>
